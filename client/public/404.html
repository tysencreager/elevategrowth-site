<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Elevate Growth Solutions</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Lora:wght@400;500&family=Montserrat:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Lora', serif;
        background-color: #fdfdfd;
        color: #000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid #e0e0e0;
      }

      .header-inner {
        max-width: 72rem;
        margin: 0 auto;
      }

      .logo-link {
        text-decoration: none;
        color: #000;
        font-family: 'Noto Serif', serif;
        font-weight: 600;
        font-size: 1.25rem;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }

      .content {
        text-align: center;
        max-width: 32rem;
      }

      .error-code {
        font-family: 'Noto Serif', serif;
        font-weight: 600;
        font-size: 5rem;
        line-height: 1;
        color: #266d82;
        margin-bottom: 1rem;
      }

      h1 {
        font-family: 'Noto Serif', serif;
        font-weight: 600;
        font-size: 1.75rem;
        margin-bottom: 1rem;
      }

      p {
        font-family: 'Lora', serif;
        font-size: 1.125rem;
        color: #444;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .links {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        font-family: 'Montserrat', sans-serif;
        font-weight: 500;
        font-size: 0.9375rem;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 0.5rem;
        transition: opacity 0.2s ease;
      }

      .btn:hover {
        opacity: 0.85;
      }

      .btn-primary {
        background-color: #266d82;
        color: #fdfdfd;
      }

      .btn-outline {
        background-color: transparent;
        color: #266d82;
        border: 2px solid #266d82;
      }

      footer {
        padding: 1.5rem;
        text-align: center;
        border-top: 1px solid #e0e0e0;
        font-family: 'Montserrat', sans-serif;
        font-size: 0.8125rem;
        color: #666;
      }

      footer a {
        color: #266d82;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a href="/" class="logo-link">Elevate Growth Solutions</a>
      </div>
    </header>

    <main>
      <div class="content">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>
          The page you're looking for doesn't exist or may have been moved.
          Let's get you back on track.
        </p>
        <div class="links">
          <a href="/" class="btn btn-primary">Back to Homepage</a>
          <a href="/contact" class="btn btn-outline">Contact Us</a>
        </div>
      </div>
    </main>

    <footer>
      &copy; 2026 <a href="/">Elevate Growth Solutions</a>. All rights reserved.
    </footer>
  </body>
</html>
